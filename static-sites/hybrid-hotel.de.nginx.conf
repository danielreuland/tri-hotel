# hybrid-hotel.de – vorerst Weiterleitung auf fitnessracing-hotel.de. Bewusst 302 (vorübergehend), damit die Domain
# später für ein eigenes Thema genutzt werden kann, ohne dass Browser/Google eine dauerhafte Weiterleitung gespeichert haben.
server {
    listen 80;
    listen [::]:80;
    server_name hybrid-hotel.de www.hybrid-hotel.de;
    access_log /var/log/nginx/fitnessracing-hotel.de/hybrid-access.log;
    error_log  /var/log/nginx/fitnessracing-hotel.de/hybrid-error.log warn;
    location / { return 302 https://fitnessracing-hotel.de$request_uri; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hybrid-hotel.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hybrid-hotel.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
