# fitnessracing-hotel.de – vorerst statische Platzhalterseite aus /var/www/fitnessracing-hotel.de/html. SSL ergänzt Certbot.
server {
    server_name fitnessracing-hotel.de www.fitnessracing-hotel.de;
    if ($host = www.fitnessracing-hotel.de) { return 301 https://fitnessracing-hotel.de$request_uri; }

    # Zugriffsprotokolle 7 Tage (siehe Datenschutzhinweis auf der Seite)
    access_log /var/log/nginx/fitnessracing-hotel.de/access.log;
    error_log  /var/log/nginx/fitnessracing-hotel.de/error.log warn;

    root /var/www/fitnessracing-hotel.de/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        limit_req zone=th_general burst=60 nodelay;
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fitnessracing-hotel.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fitnessracing-hotel.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    listen 80;
    listen [::]:80;
    server_name fitnessracing-hotel.de www.fitnessracing-hotel.de;
    return 301 https://fitnessracing-hotel.de$request_uri;
}
