# /etc/nginx/sites-available/tri-hotel  (danach: certbot --nginx -d tri-hotel.de -d www.tri-hotel.de)
# Weitere Ranking-Subdomains (z. B. rad.tri-hotel.de) einfach bei server_name ergänzen.
server {
    listen 80;
    server_name tri-hotel.de www.tri-hotel.de;

    client_max_body_size 10m;   # Bild-Uploads im Admin

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
